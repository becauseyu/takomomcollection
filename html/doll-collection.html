<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的娃娃收藏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-50">
    <div id="app">
        <div class="min-h-screen py-8">
            <!-- 头部 -->
            <header class="mb-12">
                <div class="max-w-7xl mx-auto px-4">
                    <h1 class="text-4xl font-bold text-purple-900 mb-2">🎎 我的娃娃收藏</h1>
                    <p class="text-gray-600">共 {{ totalCount }} 个娃娃</p>
                </div>
            </header>

            <!-- 搜索和过滤区域 -->
            <div class="max-w-7xl mx-auto px-4 mb-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <!-- 搜索框 -->
                    <div class="mb-4">
                        <input 
                            v-model="searchQuery"
                            type="text" 
                            placeholder="搜索品名、标签..."
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        >
                    </div>

                    <!-- 标签过滤 -->
                    <div v-if="allTags.length > 0" class="flex flex-wrap gap-2">
                        <button 
                            @click="selectedTags = []"
                            :class="selectedTags.length === 0 ? 'bg-purple-500 text-white' : 'bg-gray-200 text-gray-700'"
                            class="px-3 py-1 rounded-full text-sm transition-colors"
                        >
                            全部
                        </button>
                        <button 
                            v-for="tag in allTags" 
                            :key="tag"
                            @click="toggleTag(tag)"
                            :class="selectedTags.includes(tag) ? 'bg-purple-500 text-white' : 'bg-gray-200 text-gray-700'"
                            class="px-3 py-1 rounded-full text-sm transition-colors"
                        >
                            {{ tag }}
                        </button>
                    </div>
                </div>
            </div>

            <!-- 加载状态 -->
            <div v-if="loading" class="max-w-7xl mx-auto px-4 text-center">
                <p class="text-gray-600">加载中...</p>
            </div>

            <!-- 错误提示 -->
            <div v-if="error" class="max-w-7xl mx-auto px-4 mb-4">
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                    <p>错误: {{ error }}</p>
                    <p class="text-sm mt-2">请检查 GAS API 网址是否正确</p>
                </div>
            </div>

            <!-- 卡片网格 -->
            <div v-if="!loading && filteredDolls.length > 0" class="max-w-7xl mx-auto px-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div 
                        v-for="doll in filteredDolls" 
                        :key="doll.id"
                        class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow"
                    >
                        <!-- 图片 -->
                        <div class="aspect-square bg-gray-200 overflow-hidden">
                            <img 
                                v-if="doll.图片" 
                                :src="doll.图片" 
                                :alt="doll.品名"
                                class="w-full h-full object-cover hover:scale-105 transition-transform"
                            >
                            <div v-else class="w-full h-full flex items-center justify-center text-gray-400">
                                <span>暂无图片</span>
                            </div>
                        </div>

                        <!-- 内容 -->
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-gray-800 mb-2 truncate">{{ doll.品名 }}</h3>
                            
                            <!-- 基本信息 -->
                            <div class="space-y-1 text-sm text-gray-600 mb-3">
                                <p v-if="doll.购入来源"><strong>来源:</strong> {{ doll.购入来源 }}</p>
                                <p v-if="doll.购入时间"><strong>购入:</strong> {{ doll.购入时间 }}</p>
                                <p v-if="doll['购入价格(台幣)']" class="text-purple-600 font-semibold">
                                    💰 NT$ {{ doll['购入价格(台幣)'] }}
                                </p>
                            </div>

                            <!-- 标签 -->
                            <div v-if="doll.标签" class="flex flex-wrap gap-1 mb-3">
                                <span 
                                    v-for="tag in parseTags(doll.标签)"
                                    :key="tag"
                                    class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded"
                                >
                                    {{ tag }}
                                </span>
                            </div>

                            <!-- 备注 -->
                            <p v-if="doll.备注" class="text-xs text-gray-500 italic">
                                {{ doll.备注 }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 无结果 -->
            <div v-if="!loading && filteredDolls.length === 0" class="max-w-7xl mx-auto px-4 text-center">
                <p class="text-gray-600 text-lg">找不到匹配的娃娃 😢</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    dolls: [],
                    searchQuery: '',
                    selectedTags: [],
                    loading: true,
                    error: null,
                    // ⚠️ 替换为你的 Google Apps Script 部署网址
                    GAS_URL: 'https://script.google.com/macros/d/YOUR_DEPLOYMENT_ID/userweb?v=1'
                }
            },
            computed: {
                filteredDolls() {
                    return this.dolls.filter(doll => {
                        // 搜索过滤
                        const searchLower = this.searchQuery.toLowerCase();
                        const matchSearch = 
                            !this.searchQuery || 
                            doll.品名.toLowerCase().includes(searchLower) ||
                            (doll.备注 && doll.备注.toLowerCase().includes(searchLower)) ||
                            (doll.购入来源 && doll.购入来源.toLowerCase().includes(searchLower));

                        // 标签过滤
                        let matchTags = true;
                        if (this.selectedTags.length > 0) {
                            const dollTags = this.parseTags(doll.标签 || '');
                            matchTags = this.selectedTags.some(tag => dollTags.includes(tag));
                        }

                        return matchSearch && matchTags;
                    });
                },
                allTags() {
                    const tags = new Set();
                    this.dolls.forEach(doll => {
                        this.parseTags(doll.标签 || '').forEach(tag => tags.add(tag));
                    });
                    return Array.from(tags).sort();
                },
                totalCount() {
                    return this.dolls.length;
                }
            },
            methods: {
                async fetchData() {
                    try {
                        this.loading = true;
                        this.error = null;
                        
                        const response = await fetch(this.GAS_URL);
                        if (!response.ok) throw new Error('无法连接到 Google Sheet');
                        
                        this.dolls = await response.json();
                    } catch (err) {
                        this.error = err.message;
                        console.error('获取数据失败:', err);
                    } finally {
                        this.loading = false;
                    }
                },
                parseTags(tagString) {
                    if (!tagString) return [];
                    return tagString.split(/[,，]/).map(tag => tag.trim()).filter(tag => tag);
                },
                toggleTag(tag) {
                    const index = this.selectedTags.indexOf(tag);
                    if (index > -1) {
                        this.selectedTags.splice(index, 1);
                    } else {
                        this.selectedTags.push(tag);
                    }
                }
            },
            mounted() {
                this.fetchData();
            }
        }).mount('#app');
    </script>
</body>
</html>
